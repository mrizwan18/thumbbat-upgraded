services:
  - type: web
    name: thumbbat-socket
    env: node
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # WEB_ORIGIN intentionally omitted: no thumbbat-web service is
      # deployed on Render (the real client is Unity, which is not
      # subject to browser CORS at all). Add this var with a real origin
      # if a browser-based frontend is ever deployed separately; until
      # then the server logs a warning and falls back to allow-all CORS
      # (see server/socket-server.ts) rather than failing closed.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: thumbbat
